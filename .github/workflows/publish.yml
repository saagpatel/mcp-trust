name: Publish to PyPI

# The PyPI trusted publisher for mcp-trust is bound to this file name
# (publish.yml) and the `pypi` environment. Renaming either breaks publishing.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    name: Check, build, reproduce and inventory
    runs-on: ubuntu-24.04
    permissions:
      contents: read   # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Evidence verification resolves recorded source commits.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        run: python -m pip install uv==0.13.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.0.0
        with:
          python-version: "3.15"

      - name: Set project interpreter
        run: echo "UV_PYTHON=3.15" >> "$GITHUB_ENV"

      - name: Require the tag to match the project version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          test "$TAG" = "v$version" || { echo "::error::tag $TAG does not match project version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release candidate
        run: make setup && make check

      - name: Build wheel and sdist
        run: uv build --no-create-gitignore --out-dir dist

      - name: Reproducible-build check (rebuild from a fresh clone, compare SHA-256)
        run: |
          mkdir -p supply-chain
          python3 scripts/check_reproducible_build.py --reference dist \
            --report supply-chain/reproducible-build.json \
            --build 'uv build --no-create-gitignore --out-dir {out}'

      - name: Generate CycloneDX SBOM from the locked runtime dependencies
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Runtime dependencies plus the optional `engine` extra; dev tools excluded.
          uv export --preview-features sbom-export --format cyclonedx1.5 --locked --no-dev --extra engine \
            --output-file "supply-chain/mcp-trust-$VERSION.cdx.json"
          (cd dist && sha256sum ./*) | tee supply-chain/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain
          path: supply-chain/
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Attest build provenance and SBOM
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write      # Sigstore signing certificate
      attestations: write  # store attestations on this repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: supply-chain
          path: supply-chain/

      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          # Storage records need an organization-owned repository.
          create-storage-record: false

      - name: Locate SBOM
        id: sbom
        run: echo "path=$(ls supply-chain/*.cdx.json)" >> "$GITHUB_OUTPUT"

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: ${{ steps.sbom.outputs.path }}
          create-storage-record: false

  publish:
    name: Publish to PyPI
    needs: [build, attest]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
