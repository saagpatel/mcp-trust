name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read   # checkout needs read on this (private) repo
      id-token: write  # OIDC trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        run: python -m pip install uv==0.13.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.15"

      - name: Set project interpreter
        run: echo "UV_PYTHON=3.15" >> "$GITHUB_ENV"

      - name: Check release candidate
        run: make setup && make check

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 resolved 2026-10-05
        with:
          packages-dir: dist/
