name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Evidence verification resolves the recorded source commit and hashes
          # its blobs, so CI must retain the referenced history.
          fetch-depth: 0

      - name: Install uv
        run: python -m pip install uv==0.12.4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run --no-sync pytest -q
