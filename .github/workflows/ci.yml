name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Evidence verification resolves the recorded source commit and hashes
          # its blobs, so CI must retain the referenced history.
          fetch-depth: 0

      - name: Install uv
        run: python -m pip install uv==0.13.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up project
        run: make setup

      - name: Check project
        run: make check

  # Branch protection requires a single check named `test`; it passes only when every
  # Python lane above passed.
  test:
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Python lane to pass
        run: test "${{ needs.check.result }}" = "success"
