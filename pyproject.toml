[project]
name = "mcp-trust"
version = "0.1.1"
description = "A neutral public trust registry for MCP servers — check before you connect."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "cryptography>=50.0.0,<51",
    "pydantic>=2.13.4",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "typer>=0.26.7",
    "rich>=15.0.0",
    "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
# Real scanning backend. Without it, the registry runs on the StubEngine.
# Upper bound: a major bump of the scan engine is a contract change that must
# fail at resolve time, not as an AttributeError mid-scan.
engine = ["mcp-audits>=2.7.0,<3"]
dev = [
    "pytest>=9.1.0",
    "httpx>=0.28.1",
    "ruff>=0.15.17",
    "pyright==1.1.414",
]

[project.scripts]
mcp-trust = "mcp_trust.cli.main:app"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_trust"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.13.0"

[tool.pyright]
include = [
    "src/mcp_trust/core",
    "src/mcp_trust/store",
    "src/mcp_trust/api",
    "src/mcp_trust/engine/base.py",
    "src/mcp_trust/engine/stub.py",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
